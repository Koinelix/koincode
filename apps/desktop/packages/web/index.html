<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <!-- Chrome dev 下可能不发 favicon 网络请求；内嵌小尺寸 App 图标，避免标签页回退到默认图标。-->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%221024%22%20height%3D%221024%22%20viewBox%3D%220%200%20512%20512%22%20role%3D%22img%22%20aria-labelledby%3D%22title%20desc%22%3E%0A%20%20%3Ctitle%20id%3D%22title%22%3EKoinCode%20app%20icon%3C%2Ftitle%3E%0A%20%20%3Cdesc%20id%3D%22desc%22%3EAn%20ivory%20KC%20ligature%20on%20a%20forest%20teal%20rounded%20square.%3C%2Fdesc%3E%0A%20%20%3Crect%20x%3D%2216%22%20y%3D%2216%22%20width%3D%22480%22%20height%3D%22480%22%20rx%3D%22108%22%20fill%3D%22%23064D46%22%2F%3E%0A%20%20%3Cpath%20fill%3D%22%23FFF6E6%22%20d%3D%22M92%20126H151V223L240%20140C251%20130%20264%20126%20280%20126H340C395%20126%20431%20157%20438%20215H384C377%20191%20363%20182%20340%20182H291C277%20182%20268%20186%20258%20195L194%20259L259%20324C268%20333%20278%20337%20291%20337H340C363%20337%20378%20325%20384%20301H438C430%20359%20395%20392%20340%20392H280C259%20392%20242%20386%20226%20371L151%20297V392H92Z%22%2F%3E%0A%3C%2Fsvg%3E%0A"
    />
    <title>KoinCode</title>
    <script>
      (() => {
        // JS bundle 执行前先按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "fcode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-fcode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const finalTheme = resolved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-fcode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-fcode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--fcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--fcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-fcode-bootstrap-theme="light"] body {
        background: var(--fcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--fcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-fcode-browser-theme-surface],
      html[data-fcode-browser-theme-surface] body,
      html[data-fcode-browser-theme-surface] #root {
        /* 共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--fcode-bootstrap-bg, #161616)) !important;
      }

      html[data-fcode-browser-theme-surface="light"],
      html[data-fcode-browser-theme-surface="light"] body,
      html[data-fcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--fcode-bootstrap-bg, #f8f8f8)) !important;
      }

      .fcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。*/
        background: var(--fcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--fcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-fcode-bootstrap-theme="light"] .fcode-boot-loading {
        background: var(--fcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--fcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .fcode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: transparent;
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .fcode-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .fcode-boot-loading__logo {
        width: 96px;
        height: 96px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。-->
      <div
        class="fcode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="fcode-boot-loading__logo-shell">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            class="fcode-boot-loading__logo"
            aria-hidden="true"
          >
<animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="1;0.7;1" />
<rect x="16" y="16" width="480" height="480" rx="108" fill="#064D46"/>
<path fill="#FFF6E6" d="M92 126H151V223L240 140C251 130 264 126 280 126H340C395 126 431 157 438 215H384C377 191 363 182 340 182H291C277 182 268 186 258 195L194 259L259 324C268 333 278 337 291 337H340C363 337 378 325 384 301H438C430 359 395 392 340 392H280C259 392 242 386 226 371L151 297V392H92Z"/>
</svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
