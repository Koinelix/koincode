                    "required": [
                      "image_b64"
                    ]
                  }
                ],
                "properties": {
                  "image_b64": {
                    "contentEncoding": "base64",
                    "description": "The image as one standard padded Base64 string on a single line, without a data: prefix: png, jpeg, webp or gif, at most 10 MiB decoded. Produce it in code and put it into the request body (shell: base64 < photo.png | tr -d '\\n'; Python: base64.b64encode(data).decode()). Tip for clients that write tool-call arguments by hand, token by token: a long string is easily corrupted, so send a small image that way (a few thousand characters), or use image_url, or let code build the request. Use either image_url or image_b64.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "image_url": {
